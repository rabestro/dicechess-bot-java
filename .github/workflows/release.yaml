name: "Ops: Release"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat << EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>github-dicechess-engine</id>
                      <username>${{ github.actor }}</username>
                      <password>${{ secrets.GITHUB_TOKEN }}</password>
                  </server>
              </servers>
          </settings>
          EOF

      - name: Run validation checks
        run: mvn clean test -s ~/.m2/settings.xml

      - name: Get latest tag
        id: get_tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        uses: actions/github-script@v7
        with:
          script: |
            const latestTag = '${{ steps.get_tag.outputs.latest_tag }}';
            const bumpType = '${{ github.event.inputs.bump }}';

            const cleanVersion = latestTag.startsWith('v') ? latestTag.slice(1) : latestTag;
            const match = cleanVersion.match(/^(\d+)\.(\d+)\.(\d+)/);

            let major = 0;
            let minor = 0;
            let patch = 0;

            if (match) {
              major = parseInt(match[1], 10);
              minor = parseInt(match[2], 10);
              patch = parseInt(match[3], 10);
            }

            if (bumpType === 'major') {
              major += 1;
              minor = 0;
              patch = 0;
            } else if (bumpType === 'minor') {
              minor += 1;
              patch = 0;
            } else {
              patch += 1;
            }

            const releaseVersion = `${major}.${minor}.${patch}`;
            const releaseTag = `v${releaseVersion}`;
            const nextSnapshotVersion = `${major}.${minor}.${patch + 1}-SNAPSHOT`;

            core.setOutput('release_version', releaseVersion);
            core.setOutput('release_tag', releaseTag);
            core.setOutput('next_snapshot', nextSnapshotVersion);
            console.log(`Release version: ${releaseVersion} (${releaseTag})`);
            console.log(`Next snapshot: ${nextSnapshotVersion}`);

      - name: Set Release Version in pom.xml
        run: |
          mvn versions:set -DnewVersion=${{ steps.bump_version.outputs.release_version }} -DgenerateBackupPoms=false -s ~/.m2/settings.xml

      - name: Create and push Git tag
        run: |
          git tag ${{ steps.bump_version.outputs.release_tag }}
          git push origin ${{ steps.bump_version.outputs.release_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (Versioned & Latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/dicechess-bot-java:latest
            ghcr.io/${{ github.repository_owner }}/dicechess-bot-java:${{ steps.bump_version.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/dicechess-bot-java:${{ steps.bump_version.outputs.release_version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.bump_version.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --generate-notes \
            --title "$RELEASE_TAG"

      - name: Bump to Next SNAPSHOT Version in pom.xml
        run: |
          mvn versions:set -DnewVersion=${{ steps.bump_version.outputs.next_snapshot }} -DgenerateBackupPoms=false -s ~/.m2/settings.xml
          git add pom.xml
          git commit -m "chore(release): bump version to ${{ steps.bump_version.outputs.next_snapshot }}"
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          git push origin "$BRANCH_NAME"
